name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify ESM consumer import
        run: |
          node --input-type=module -e "
            import('./dist/index.js').then((mod) => {
              if (mod.PACKAGE_NAME !== '@weacademy/bytechain-shared') {
                throw new Error('Unexpected ESM export: ' + mod.PACKAGE_NAME);
              }
              console.log('ESM import OK');
            });
          "

      - name: Verify CJS consumer require
        run: |
          node -e "
            const mod = require('./dist/index.cjs');
            if (mod.PACKAGE_NAME !== '@weacademy/bytechain-shared') {
              throw new Error('Unexpected CJS export: ' + mod.PACKAGE_NAME);
            }
            console.log('CJS require OK');
          "
